# Linux 기반 CI 회귀 안전망.
#
# 설계 결정 (Phase 2-P1B 디버깅, 2026-04-21):
#   - 초기 설계는 Linux 에서 `pytest --disable-socket` opt-in 으로 회귀 안전망
#     이중화하려 했음 (Windows ProactorEventLoop 호환성 이유로 conftest autouse
#     에선 제외). 그러나 PR #5 ~ #21 누적 13개 PR 의 CI 가 "Failing after 1m"
#     으로 빠르게 실패 — collection 단계 import 에러 신호.
#   - 의심 1순위: `--disable-socket` 이 Linux 에서도 일부 lib (httpx/requests/
#     langfuse OTel 등) 의 *import 시점* socket 호출을 차단해 부작용. Windows
#     autouse 와 같은 본질적 문제일 가능성.
#   - 1차 액션: `--disable-socket` 제거. 네트워크 차단의 주력 안전망은 conftest
#     의 FakeProvider monkeypatch — 이게 LLM 호출 자체를 차단하므로 외부 네트워크
#     도달 가능성 0. pytest-socket 은 *추가* 안전망일 뿐, 없어도 안전.
#   - 향후 Linux 동작 확인 후 `--disable-socket --allow-hosts=127.0.0.1` 같은
#     방식으로 점진 재도입 가능.
#
#   상세 기록: docs/progress/phase2_priority1_complete.md §3-1 + 본 PR 메시지.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치/PR에 새 push가 들어오면 진행 중인 run을 취소해 러너 시간 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # v13 P25 — Node 보장: 배포성 게이트의 실 런타임 probe 통합 테스트
      # (test_p25 TestRealProbeIntegration, skipif node 부재)가 *결정적으로* 실행되도록.
      # 없으면 ubuntu 이미지에 node 가 우연히 있을 때만 돌아 핵심 spawn 경로 커버리지가 환경 의존.
      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Show Python / pip versions
        run: |
          python --version
          pip --version
          uname -a

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show installed packages (diagnostic)
        # 디버깅 목적 — Linux 환경의 실제 설치 버전 + 의존성 그래프 확인용.
        # 향후 ci 안정화되면 제거 가능.
        run: pip list

      - name: Run pytest
        # 네트워크 차단은 conftest 의 FakeProvider monkeypatch 가 담당 — LLM
        # 호출 자체가 차단되므로 외부 네트워크 도달 가능성 0.
        # `--disable-socket` 제거 이력은 본 파일 상단 코멘트 참조.
        # `-v --tb=short` 로 실패 시 어떤 테스트인지 즉시 식별.
        run: pytest -v --tb=short
