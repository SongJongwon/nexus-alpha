# Linux 기반 CI 회귀 안전망.
#
# 설계 결정 (Phase 2-P1B, 2026-04-17):
#   - Windows에서는 `pytest-socket`의 `disable_socket()`이 ProactorEventLoop의
#     내부 `socket.socketpair()`까지 차단해 anyio.run() 경로가 전부 실패한다
#     (`docs/progress/phase2_priority1_complete.md` §3-1 참조). 따라서 conftest의
#     autouse fixture에서 제외하고 Linux CI에서 `--disable-socket` 플래그로만
#     opt-in 한다.
#   - Linux의 `SelectorEventLoop`는 `os.pipe2` 기반 self-pipe를 사용하므로
#     소켓 차단이 이벤트 루프 초기화에 영향을 주지 않는다. 안전하게 적용 가능.
#   - 네트워크 차단의 주력 안전망은 `conftest.py`의 FakeProvider monkeypatch.
#     `--disable-socket`은 회귀 시 즉시 실패시키는 보조 안전망이다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치/PR에 새 push가 들어오면 진행 중인 run을 취소해 러너 시간 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show Python / pip versions
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (with --disable-socket safety net)
        # FakeProvider monkeypatch가 1차 안전망, --disable-socket이 2차 안전망.
        # 두 단계 모두 통과해야 회귀 0건으로 본다.
        run: pytest --disable-socket
